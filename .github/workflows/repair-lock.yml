name: Repair shared npm lockfile
on:
  push:
    branches: [fix/ci-lockfile-20261029]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Complete optional dependency metadata
        run: npm install --package-lock-only --ignore-scripts --include=optional --no-audit --no-fund
      - name: Check clean installation
        run: npm ci --no-audit --no-fund
      - name: Commit repaired lockfile on repair branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "fix(ci): complete optional dependency lock entries"
          git push origin HEAD:fix/ci-lockfile-20261029
